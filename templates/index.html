<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sentiment Analysis</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        p {
            text-align: center;
            color: #666;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 10px;
            resize: none;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #333;
            color: white;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            background: #f1f1f1;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Sentiment Analysis</h1>

    <p>
        NLP + Machine Learning Sentiment Analyzer
    </p>


    <form action="/predict" method="POST">

        <textarea
            name="text"
            placeholder="Enter your review here..."
            required>{{ text if text else "" }}</textarea>

        <button type="submit">
            Analyze Sentiment
        </button>

    </form>


    {% if prediction %}

    <div class="result">

        <h2>Prediction</h2>

        <h3>
            {{ prediction.upper() }}
        </h3>

    </div>

    {% endif %}


</div>

</body>

</html>
